name: phpz_skel Test

on:
  push:
    branches: ["dev"]
    paths:
      - "tools/phpz_skel.php"
      - "tools/php/**"
      - "build/Phpz.zig"
      - "examples/skeleton/**"
      - ".github/scripts/test-phpz-skel.sh"
      - ".github/scripts/setup-php-windows.ps1"
      - ".github/workflows/test-phpz-skel.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "tools/phpz_skel.php"
      - "tools/php/**"
      - "build/Phpz.zig"
      - "examples/skeleton/**"
      - ".github/scripts/test-phpz-skel.sh"
      - ".github/scripts/setup-php-windows.ps1"
      - ".github/workflows/test-phpz-skel.yml"
  workflow_dispatch:

env:
  # Match the default checkout, including the merge commit for fork PRs.
  PHPZ_REF: ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.tar.gz

jobs:
  unix:
    name: test (${{ matrix.os }}, php 8.2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: php-config
      - name: Run phpz_skel tests
        shell: bash
        run: bash .github/scripts/test-phpz-skel.sh
      - name: Run phpz_skel tests (--onlyunix)
        shell: bash
        run: bash .github/scripts/test-phpz-skel.sh -- --onlyunix

  windows:
    name: test (windows-latest, php 8.2)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
      - name: Install pkg-config
        shell: pwsh
        run: |
          choco install pkgconfiglite --no-progress -y
          where.exe pkg-config
      - name: Setup PHP runtime and development files
        shell: pwsh
        run: |
          .\.github\scripts\setup-php-windows.ps1 `
            -PhpVersion "8.2" `
            -Arch "x64" `
            -ThreadSafety "nts" `
            -Destination (Join-Path $env:RUNNER_TEMP "php-sdk")
      - name: Run phpz_skel tests
        shell: bash
        env:
          ZIG_TARGET: native-native-msvc
        run: bash .github/scripts/test-phpz-skel.sh
      - name: Run phpz_skel tests (--onlywindows)
        shell: bash
        env:
          ZIG_TARGET: native-native-msvc
        run: bash .github/scripts/test-phpz-skel.sh -- --onlywindows
